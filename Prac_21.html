<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Example</title>
    <script>
        // Function to set a cookie
        function setCookie(name, value, days) {
            var expires = "";
            if (days) {
                var date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000)); expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        // Function to get a cookie 
        function getCookie(name) {
            var nameEQ = name + "=";
            var ca = document.cookie.split(';'); for (var i = 0; i < ca.length; i++) {
                var c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // Function to save color and change background 
        function saveColor() {
            var color = document.getElementById("colorInput").value; setCookie("bgColor", color, 7); // Cookie will last for 7 days document.body.style.backgroundColor = color;
        }

        // Function to check for saved color on page load 
        function checkCookie() {
            var savedColor = getCookie("bgColor"); if (savedColor) {
                document.body.style.backgroundColor = savedColor; document.getElementById("colorInput").value = savedColor;
            }
        }

        // Call checkCookie when the page loads 
        window.onload = checkCookie;
    </script>
</head>

<body>
    <h1>Color Cookie Example</h1>
    <input type="text" id="colorInput" placeholder="Enter a color name">
    <button onclick="saveColor()">SAVE</button>
</body>

</html>
